<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Form</title>
</head>
<body>

    <h1>Volunteer Form</h1>

    <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php"
          method="post">

        <fieldset>
            <legend>My Info</legend>

            <!-- First Name -->
            <div>
                <label for="fname">First Name:</label><br>
                <input type="text"
                       id="fname"
                       name="first_name_field"
                       required>
            </div>

            <br>

            <!-- Last Name -->
            <div>
                <label for="lname">Last Name:</label><br>
                <input type="text"
                       id="lname"
                       name="last_name_field"
                       required>
            </div>

        </fieldset>

        <!-- Hidden Field -->
        <input type="hidden"
               name="hidden_field"
               value="Abisai">

        <br><br>

        <input type="submit" value="Submit Query">

    </form>

</body>
</html>
